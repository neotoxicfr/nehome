name: Bug report
description: Something is broken or shows wrong values.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nehome version` or the image tag.
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Integration type and service version
      placeholder: "sonarr, Sonarr 4.0.20"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The tile from config.yaml (remove secrets and private hostnames), and steps.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker logs nehome` around the problem. Check that no key or token is included."
      render: text
