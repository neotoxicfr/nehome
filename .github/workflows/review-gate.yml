name: review-gate

# Required status "review" on dev: green only once CodeRabbit really reviewed
# the head commit (a skipped, rate-limited or failed review stays pending, so
# auto-merge waits). Every 6 h, a still-unreviewed head is asked for a review
# again, once per commit.
on:
  check_run:
    types: [completed]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'check_run' || github.event.check_run.app.id == 347564
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          gh pr list -R "$REPO" --base dev --state open --json number,headRefOid --jq '.[]|"\(.number) \(.headRefOid)"' |
          while read -r n sha; do
            cr=$(gh api "repos/$REPO/commits/$sha/check-runs?app_id=347564" \
              --jq '[.check_runs[]|select(.status=="completed")]|sort_by(.completed_at)|last|select(.)|.conclusion+" "+.output.summary')
            case "$cr" in
              "success "*"Review completed"*|*"No files to review"*) state=success desc="CodeRabbit a relu ce commit" ;;
              *) state=pending desc="En attente d'une vraie revue CodeRabbit" ;;
            esac
            gh api -X POST "repos/$REPO/statuses/$sha" -f state="$state" -f context=review -f description="$desc" >/dev/null
            # Sweep only, once per commit, and only after CodeRabbit gave up on it.
            if [ "$state" = pending ] && [ -n "$cr" ] && [ "$GITHUB_EVENT_NAME" != check_run ] &&
               ! gh api "repos/$REPO/issues/$n/comments" --jq '.[].body' | grep -q "review-retry:$sha"; then
              gh pr comment "$n" -R "$REPO" --body "@coderabbitai full review <!-- review-retry:$sha -->"
            fi
          done
