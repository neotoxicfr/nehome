name: review-gate

# Required status "review" on dev: green only once CodeRabbit really reviewed
# the head commit (a skipped, rate-limited or failed review stays pending, so
# auto-merge waits; the maintainer asks "@coderabbitai full review" again).
# Dependabot pull requests are not reviewed (CodeRabbit ignores them): the CI
# alone decides for them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: review-gate
  cancel-in-progress: false

jobs:
  gate:
    # Fork pull requests get a read-only token: their status comes from the check_run and sweep runs.
    if: >-
      (github.event_name != 'check_run' || github.event.check_run.app.id == 347564) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          gh pr list -R "$REPO" --base dev --state open --json number,headRefOid,author --jq '.[]|"\(.number) \(.headRefOid) \(.author.login)"' |
          while read -r n sha author; do
            if [ "$author" = "app/dependabot" ]; then
              gh api -X POST "repos/$REPO/statuses/$sha" -f state=success -f context=review -f description="Montée Dependabot : la CI décide" >/dev/null
              continue
            fi
            cr=$(gh api "repos/$REPO/commits/$sha/check-runs?app_id=347564" \
              --jq '[.check_runs[]|select(.status=="completed")]|sort_by(.completed_at)|last|select(.)|.conclusion+" "+.output.summary')
            case "$cr" in
              "success "*"Review completed"*|*"No files to review"*) state=success desc="CodeRabbit a relu ce commit" ;;
              *) state=pending desc="En attente d'une vraie revue CodeRabbit" ;;
            esac
            gh api -X POST "repos/$REPO/statuses/$sha" -f state="$state" -f context=review -f description="$desc" >/dev/null
          done
