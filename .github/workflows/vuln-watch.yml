name: vuln-watch

# Daily vulnerability scan of dev. Never fails (no daily mail): findings open
# or update a single issue, which is closed once dev is clean again.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vuln-watch
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TITLE: Vulnérabilité à corriger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... > report.txt 2>&1; g=$?
          docker build -q -t nehome:watch . >/dev/null
          for t in "fs /src" "image nehome:watch"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD:/src:ro" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c $t -q \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 >> report.txt 2>&1 || g=1
          done
          echo "found=$g" >> "$GITHUB_ENV"
      - name: Open, update or close the issue
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$found" != 0 ]; then
            body=$(printf 'Analyse quotidienne de `dev` (govulncheck, Trivy).\n\n```\n%s\n```\n' "$(tail -c 60000 report.txt)")
            # Only the creation mentions the owner: one notification per finding, not one per day.
            if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$TITLE" --body "@$GITHUB_REPOSITORY_OWNER $body"; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Plus rien de signalé sur dev."
          fi
