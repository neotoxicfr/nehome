# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit advises; the CI (scripts/ci.sh) and the maintainer decide.
language: fr-FR
tone_instructions: "Concis et factuel : le problème, sa conséquence concrète, le correctif. Pas de félicitations ni de résumé du code."

reviews:
  profile: chill
  auto_approvals:
    enabled: false # never approves nor requests changes on its own
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  commit_status: true # read by review-gate.yml: auto-merge waits for a real review
  fail_commit_status: false
  in_progress_fortune: false
  suggested_reviewers: false # single maintainer
  auto_assign_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["dev"] # plus the default branch (main)
    ignore_usernames: ["dependabot[bot]"] # bumps: the CI decides, and the review quota is spared
  pre_merge_checks:
    docstrings:
      mode: "off" # comments are short and in French; no docstring coverage target
    title:
      mode: warning
      requirements: "Conventional Commits in English: type(scope): summary, for example fix(integ): …, feat(web): …, chore(deps): …"

  path_filters:
    - "!go.sum"
    - "!internal/integ/spec_gen.go" # generated by cmd/genspec; the CI fails when it is stale
    - "!docs/images/**"
    - "!**/*.png"
    - "!**/*.ico"
    - "!bin/**"
    - "!release/**"
    - "!data/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        Règles dures du projet (dépôt public) :
        - Aucune donnée d'installation réelle : pas d'IP privée ou publique réelle, de nom d'hôte, de domaine, d'e-mail, de clé, de nom de tracker ni d'empreinte de torrent. Exemples : example.org, 192.0.2.0/24, 203.0.113.0/24, user@example.com, valeurs « factice ».
        - Aucun secret dans le code, les tests, la doc ou un message de log ou d'erreur.
        - Interface en français (assumé, ne pas proposer de traduire l'interface). Commentaires du code Go en français ; ceux de .github/ et des fichiers de configuration peuvent rester en anglais.
    - path: "internal/integ/**"
      instructions: |
        Une intégration = un fichier <type>.go enregistré dans le registre de integ.go (Fields + Run, Actions/Do en option).
        - Le sondage est en lecture seule. Une écriture n'arrive que par Do, sur un clic d'administrateur ; signaler toute écriture déclenchée par le sondage ou l'affichage.
        - Secrets lus par secret("<rôle>") ; un rôle facultatif n'est lu que s'il est déclaré dans t.Secrets. Les clés vont dans des en-têtes, et doivent disparaître des erreurs (redact, cleanErr).
        - Clients HTTP via httpClient() : délai d'expiration, et redirection refusée vers un autre hôte (sameHost). Une URL d'action qui porte une clé doit viser le même hôte que l'URL lue.
        - Coût pour le service surveillé : rythme selon le coût (every), une seule requête à la fois par boucle, recul quand le service ne répond plus, pas d'appel coûteux (test d'indexeur, recherche) dans le sondage.
        - Choix d'une action (Choices) : protégés par un verrou et revalidés dans Do.
        - Tests avec httptest et des réponses réelles anonymisées ; un test doit échouer sur la version d'avant un correctif.
        - Toute nouvelle option ou rôle de secret demande de relancer go run ./cmd/genspec et d'ajouter docs/integrations/<type>.md et docs/fr/integrations/<type>.md.
    - path: "internal/web/**"
      instructions: |
        - CSP stricte posée par l'application (default-src 'none'; script-src 'self'; style-src 'self') : aucun style ni script en ligne, aucune ressource externe. Les couleurs dynamiques passent par /theme.css ou le CSSOM.
        - Authentification : en-tête Remote-User cru seulement depuis auth.trusted_proxies. Toute modification et toute action sont réservées à auth.admins et vérifient l'origine (Sec-Fetch-Site/Origin).
        - La confirmation des actions risquées est exigée côté serveur, pas seulement dans le navigateur.
        - Un secret n'est jamais renvoyé au navigateur. Changer l'hôte, le port ou le protocole d'une tuile, ou couper la vérification TLS, oblige à ressaisir ses clés.
        - Assumé, ne pas re-signaler : le journal des actions contient le nom Remote-User (cité avec %q) ; c'est la traçabilité voulue, pas une fuite.
    - path: "internal/web/static/**"
      instructions: |
        JavaScript minimal, sans framework, sans dépendance ni étape de build : il remplace des fragments HTML rendus par le serveur et ouvre des fenêtres. Pas d'innerHTML sur des données non rendues par html/template. Le CSS utilise les variables de :root.
    - path: "docs/**"
      instructions: |
        La documentation anglaise (docs/) et la française (docs/fr/) disent la même chose ; signaler un écart. Les descriptions de docs/fr/integrations/ alimentent le formulaire d'ajout (cmd/genspec).
    - path: ".github/workflows/**"
      instructions: |
        Actions épinglées par SHA de commit avec la version en commentaire ; permissions minimales par job. Notes de release écrites à la main : jamais generate_release_notes ni --generate-notes. Image Docker étiquetée X.Y.Z sans « v », tag git vX.Y.Z.
    - path: ".github/dependabot.yml"
      instructions: |
        Assumé, ne pas re-signaler : vérification quotidienne sans cooldown, voulue par le mainteneur ; aucune PR n'est fusionnée automatiquement.

  tools:
    # Useful for this stack
    golangci-lint:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    biome:
      enabled: true
    # Noisy or redundant here
    languagetool:
      enabled: false # mixed French and English prose
    htmlhint:
      enabled: false # Go html/template files, not plain HTML
    osvScanner:
      enabled: false # govulncheck already gates the CI with reachability analysis

chat:
  art: false
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/architecture.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
